# Проверки запускаются на GitHub при каждой отправке кода и в каждом pull request.
# Результат — зелёная галочка или красный крестик у коммита.
name: Проверки

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python app.py test
