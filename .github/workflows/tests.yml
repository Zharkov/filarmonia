# Проверки запускаются на GitHub при каждой отправке кода и в каждом pull request.
# Результат — зелёная галочка или красный крестик у коммита.
name: Проверки

on:
  push:
  pull_request:
  # Раз в неделю — даже без новых коммитов: уязвимости в пакетах находят постоянно
  schedule:
    - cron: "0 5 * * 1"

# Python — последний выпуск ветки 3.11. Точная сборка из .python-version (3.11.9)
# есть не для каждого образа Ubuntu, и без неё проверки падают ещё до установки пакетов
env:
  PYTHON_VERSION: "3.11"

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python app.py test

  # Известные уязвимости в закреплённых версиях пакетов (база PyPI/OSV)
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt
